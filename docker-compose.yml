services:
  backend:
    build:
      context: ./backend
    container_name: madar-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FRONTEND_URLS: ${FRONTEND_URLS}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      AVATAR_UPLOAD_DIR: ${AVATAR_UPLOAD_DIR:-avatar_uploads}
    ports:
      - "8001:8000"
    volumes:
      - ./backend/avatar_uploads:/app/avatar_uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: madar-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
