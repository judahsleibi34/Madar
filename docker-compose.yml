services:
  redis:
    image: redis:7-alpine
    container_name: madar-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ./backend
    container_name: madar-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FRONTEND_URLS: ${FRONTEND_URLS}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      AVATAR_UPLOAD_DIR: ${AVATAR_UPLOAD_DIR:-avatar_uploads}
      PUBLIC_UPLOADS_DIR: ${PUBLIC_UPLOADS_DIR:-uploads}
      DATA_UPLOAD_DIR: ${DATA_UPLOAD_DIR:-private_uploads}
      BUILDER_ASSET_MAX_BYTES: ${BUILDER_ASSET_MAX_BYTES:-5242880}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-12582912}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-3145728}
      MAX_SMALL_JSON_BODY_BYTES: ${MAX_SMALL_JSON_BODY_BYTES:-262144}
      MAX_DATA_JSON_BODY_BYTES: ${MAX_DATA_JSON_BODY_BYTES:-1048576}
      ALLOW_INSECURE_HTTP_URLS: ${ALLOW_INSECURE_HTTP_URLS:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-false}
      AUTH_RATE_LIMIT_LIMIT: ${AUTH_RATE_LIMIT_LIMIT:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      PASSWORD_RATE_LIMIT_LIMIT: ${PASSWORD_RATE_LIMIT_LIMIT:-10}
      PASSWORD_RATE_LIMIT_WINDOW_SECONDS: ${PASSWORD_RATE_LIMIT_WINDOW_SECONDS:-300}
      PUBLIC_RATE_LIMIT_LIMIT: ${PUBLIC_RATE_LIMIT_LIMIT:-120}
      PUBLIC_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:-60}
      DATA_WORKSPACE_RATE_LIMIT_LIMIT: ${DATA_WORKSPACE_RATE_LIMIT_LIMIT:-60}
      DATA_WORKSPACE_RATE_LIMIT_WINDOW_SECONDS: ${DATA_WORKSPACE_RATE_LIMIT_WINDOW_SECONDS:-300}
      DATA_UPLOAD_RATE_LIMIT_LIMIT: ${DATA_UPLOAD_RATE_LIMIT_LIMIT:-20}
      DATA_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${DATA_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-300}
      DATA_ANALYSIS_RATE_LIMIT_LIMIT: ${DATA_ANALYSIS_RATE_LIMIT_LIMIT:-20}
      DATA_ANALYSIS_RATE_LIMIT_WINDOW_SECONDS: ${DATA_ANALYSIS_RATE_LIMIT_WINDOW_SECONDS:-300}
      DATA_VISUALIZATION_RATE_LIMIT_LIMIT: ${DATA_VISUALIZATION_RATE_LIMIT_LIMIT:-20}
      DATA_VISUALIZATION_RATE_LIMIT_WINDOW_SECONDS: ${DATA_VISUALIZATION_RATE_LIMIT_WINDOW_SECONDS:-300}
      BUILDER_ASSET_UPLOAD_RATE_LIMIT_LIMIT: ${BUILDER_ASSET_UPLOAD_RATE_LIMIT_LIMIT:-30}
      BUILDER_ASSET_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${BUILDER_ASSET_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-300}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1}
      CSRF_ORIGIN_CHECK_ENABLED: ${CSRF_ORIGIN_CHECK_ENABLED:-true}
      CSRF_ALLOW_MISSING_ORIGIN: ${CSRF_ALLOW_MISSING_ORIGIN:-false}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      MADAR_MIGRATIONS_DIR: ${MADAR_MIGRATIONS_DIR:-/app/database/migrations}
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend/avatar_uploads:/app/avatar_uploads
      - ./backend/uploads:/app/uploads
      - ./backend/private_uploads:/app/private_uploads
      - ./database:/app/database:ro
      - ./supabase:/app/supabase:ro

  notification-worker:
    build:
      context: ./backend
    container_name: madar-notification-worker
    restart: unless-stopped
    profiles: ["workers"]
    env_file:
      - .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-false}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-25}
      NOTIFICATION_WORKER_CONCURRENCY: ${NOTIFICATION_WORKER_CONCURRENCY:-2}
      NOTIFICATION_WORKER_POLL_SECONDS: ${NOTIFICATION_WORKER_POLL_SECONDS:-5}
    command: ["python", "-m", "workers.notification_worker"]
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: madar-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
