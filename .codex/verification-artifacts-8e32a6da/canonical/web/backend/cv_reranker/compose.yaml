services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cv_ranker
      POSTGRES_USER: cv_ranker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_ranker -d cv_ranker"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: api-runtime
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cv_ranker:local-development-password@postgres:5432/cv_ranker}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql+psycopg://cv_ranker:local-development-password@postgres:5432/cv_ranker}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/data/uploads}
      TEMP_DIRECTORY: ${TEMP_DIRECTORY:-/data/tmp}
      MODEL_CACHE_DIRECTORY: ${MODEL_CACHE_DIRECTORY:-/data/models}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - private_data:/data
    restart: "no"

  api:
    build:
      context: .
      target: api-runtime
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cv_ranker:local-development-password@postgres:5432/cv_ranker}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql+psycopg://cv_ranker:local-development-password@postgres:5432/cv_ranker}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/data/uploads}
      TEMP_DIRECTORY: ${TEMP_DIRECTORY:-/data/tmp}
      MODEL_CACHE_DIRECTORY: ${MODEL_CACHE_DIRECTORY:-/data/models}
    ports: ["8080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - private_data:/data
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker-runtime
    command: ["python", "-m", "app.workers.ranking_worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cv_ranker:local-development-password@postgres:5432/cv_ranker}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql+psycopg://cv_ranker:local-development-password@postgres:5432/cv_ranker}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/data/uploads}
      TEMP_DIRECTORY: ${TEMP_DIRECTORY:-/data/tmp}
      MODEL_CACHE_DIRECTORY: ${MODEL_CACHE_DIRECTORY:-/data/models}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - private_data:/data
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped

volumes:
  postgres_data:
  private_data:
