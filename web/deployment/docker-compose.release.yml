services:
  backend:
    environment:
      BACKUP_FRESHNESS_MARKER: /run/madar-backup/latest.json
    volumes:
      - type: bind
        source: /var/lib/madar/backup-state
        target: /run/madar-backup
        read_only: true
        bind:
          create_host_path: false

networks:
  default:
    name: madar-release-${MADAR_SLOT:?slot required}-default
    ipam:
      config:
        - subnet: ${MADAR_DEFAULT_SUBNET:?default subnet required}
  parser_internal:
    name: madar-release-${MADAR_SLOT:?slot required}-parser-internal
    internal: true
    ipam:
      config:
        - subnet: ${MADAR_PARSER_SUBNET:?parser subnet required}
  remote_ingestion_internal:
    name: madar-release-${MADAR_SLOT:?slot required}-remote-internal
    internal: true
    ipam:
      config:
        - subnet: ${MADAR_REMOTE_INTERNAL_SUBNET:?remote internal subnet required}
  remote_ingestion_egress:
    name: madar-release-${MADAR_SLOT:?slot required}-remote-egress
    ipam:
      config:
        - subnet: ${MADAR_REMOTE_EGRESS_SUBNET:?remote egress subnet required}
