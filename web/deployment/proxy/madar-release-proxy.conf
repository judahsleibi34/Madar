# Stable loopback origin for Cloudflare. Install only during the controlled
# blue/green migration window; active-upstreams.conf is atomically generated.
include /var/lib/madar/releases/active-upstreams.conf;

server {
    listen 127.0.0.1:8001;
    server_name _;
    location / {
        proxy_pass http://madar_backend_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}

server {
    listen 127.0.0.1:3000;
    server_name _;
    location / {
        proxy_pass http://madar_frontend_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
