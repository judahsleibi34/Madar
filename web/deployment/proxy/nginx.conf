worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 264241152;

    map $http_upgrade $madar_connection_upgrade {
        default upgrade;
        "" close;
    }
    map $http_x_forwarded_proto $madar_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    include /etc/nginx/madar/active-upstreams.conf;

    server {
        listen 8001;
        server_name _;
        location / {
            proxy_pass http://madar_backend_active;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $madar_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $madar_connection_upgrade;
            proxy_set_header X-Request-ID $request_id;
        }
    }

    server {
        listen 3000;
        server_name _;
        location / {
            proxy_pass http://madar_frontend_active;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $madar_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $madar_connection_upgrade;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
