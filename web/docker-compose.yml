name: madar

services:
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: madar-${MADAR_SLOT:-active}-redis
    restart: unless-stopped
    user: "999:1000"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    tmpfs:
      - /data:rw,noexec,nosuid,uid=999,gid=1000,size=64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    cpus: 0.50
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    ports:
      - "127.0.0.1:${MADAR_REDIS_BIND_PORT:-6379}:6379"

  backend:
    image: ${MADAR_BACKEND_IMAGE:-madar-backend:development}
    build:
      context: ./backend
      args:
        MADAR_RELEASE_SHA: ${MADAR_RELEASE_SHA:-development}
        MADAR_BUILD_TIMESTAMP: ${MADAR_BUILD_TIMESTAMP:-unknown}
    container_name: madar-${MADAR_SLOT:-active}-backend
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    env_file:
      - ${MADAR_ENV_FILE:-../.env}
    environment:
      APP_ENV: production
      MADAR_RELEASE_SHA: ${MADAR_RELEASE_SHA:-development}
      MADAR_BUILD_TIMESTAMP: ${MADAR_BUILD_TIMESTAMP:-unknown}
      SCHEMA_COMPATIBLE_MIN: ${SCHEMA_COMPATIBLE_MIN:-81}
      SCHEMA_COMPATIBLE_MAX: ${SCHEMA_COMPATIBLE_MAX:-83}
      # Direct PostgreSQL credentials are operator-only. An explicit empty
      # override makes the key unusable even when the shared env_file contains
      # it for backup or catalog-verification tooling.
      SUPABASE_DB_URL: ""
      FRONTEND_URLS: ${FRONTEND_URLS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      AVATAR_UPLOAD_DIR: ${AVATAR_UPLOAD_DIR:-avatar_uploads}
      PUBLIC_UPLOADS_DIR: ${PUBLIC_UPLOADS_DIR:-uploads}
      DATA_UPLOAD_DIR: ${DATA_UPLOAD_DIR:-private_uploads}
      PRIVATE_CHARTS_DIR: ${PRIVATE_CHARTS_DIR:-private_generated_charts}
      BUILDER_ASSET_MAX_BYTES: ${BUILDER_ASSET_MAX_BYTES:-26214400}
      BUILDER_VIDEO_MAX_BYTES: ${BUILDER_VIDEO_MAX_BYTES:-262144000}
      BUILDER_DOCUMENT_MAX_BYTES: ${BUILDER_DOCUMENT_MAX_BYTES:-52428800}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-12582912}
      MAX_BUILDER_ASSET_REQUEST_BODY_BYTES: ${MAX_BUILDER_ASSET_REQUEST_BODY_BYTES:-264241152}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-3145728}
      MAX_SMALL_JSON_BODY_BYTES: ${MAX_SMALL_JSON_BODY_BYTES:-262144}
      MAX_DATA_JSON_BODY_BYTES: ${MAX_DATA_JSON_BODY_BYTES:-1048576}
      ALLOW_INSECURE_HTTP_URLS: ${ALLOW_INSECURE_HTTP_URLS:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-false}
      AUTH_RATE_LIMIT_LIMIT: ${AUTH_RATE_LIMIT_LIMIT:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      PASSWORD_RATE_LIMIT_LIMIT: ${PASSWORD_RATE_LIMIT_LIMIT:-10}
      PASSWORD_RATE_LIMIT_WINDOW_SECONDS: ${PASSWORD_RATE_LIMIT_WINDOW_SECONDS:-300}
      PUBLIC_RATE_LIMIT_LIMIT: ${PUBLIC_RATE_LIMIT_LIMIT:-120}
      PUBLIC_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:-60}
      DATA_WORKSPACE_RATE_LIMIT_LIMIT: ${DATA_WORKSPACE_RATE_LIMIT_LIMIT:-60}
      DATA_WORKSPACE_RATE_LIMIT_WINDOW_SECONDS: ${DATA_WORKSPACE_RATE_LIMIT_WINDOW_SECONDS:-300}
      DATA_UPLOAD_RATE_LIMIT_LIMIT: ${DATA_UPLOAD_RATE_LIMIT_LIMIT:-20}
      DATA_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${DATA_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-300}
      DATA_ANALYSIS_RATE_LIMIT_LIMIT: ${DATA_ANALYSIS_RATE_LIMIT_LIMIT:-20}
      DATA_ANALYSIS_RATE_LIMIT_WINDOW_SECONDS: ${DATA_ANALYSIS_RATE_LIMIT_WINDOW_SECONDS:-300}
      DATA_VISUALIZATION_RATE_LIMIT_LIMIT: ${DATA_VISUALIZATION_RATE_LIMIT_LIMIT:-20}
      DATA_VISUALIZATION_RATE_LIMIT_WINDOW_SECONDS: ${DATA_VISUALIZATION_RATE_LIMIT_WINDOW_SECONDS:-300}
      BUILDER_ASSET_UPLOAD_RATE_LIMIT_LIMIT: ${BUILDER_ASSET_UPLOAD_RATE_LIMIT_LIMIT:-30}
      BUILDER_ASSET_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${BUILDER_ASSET_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-300}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1}
      CSRF_ORIGIN_CHECK_ENABLED: ${CSRF_ORIGIN_CHECK_ENABLED:-true}
      CSRF_ALLOW_MISSING_ORIGIN: ${CSRF_ALLOW_MISSING_ORIGIN:-false}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      MADAR_MIGRATIONS_DIR: ${MADAR_MIGRATIONS_DIR:-/app/database/migrations}
      MADAR_TEST_REPOSITORY_ROOT: /test-repository
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      STORAGE_DISK_FREE_FLOOR_BYTES: ${STORAGE_DISK_FREE_FLOOR_BYTES:-2147483648}
      BACKUP_FRESHNESS_REQUIRED: ${BACKUP_FRESHNESS_REQUIRED:-false}
      BACKUP_FRESHNESS_MARKER: ${BACKUP_FRESHNESS_MARKER:-}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-129600}
      NOTIFICATION_WORKER_REQUIRED: ${NOTIFICATION_WORKER_REQUIRED:-false}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-false}
      NOTIFICATION_WORKER_HEALTH_URL: ${NOTIFICATION_WORKER_HEALTH_URL:-}
      NOTIFICATION_QUEUE_MAX_DEPTH: ${NOTIFICATION_QUEUE_MAX_DEPTH:-1000}
      NOTIFICATION_QUEUE_MAX_AGE_SECONDS: ${NOTIFICATION_QUEUE_MAX_AGE_SECONDS:-900}
      NOTIFICATION_QUEUE_MAX_DEAD: ${NOTIFICATION_QUEUE_MAX_DEAD:-0}
      DATA_DELETION_WORKER_REQUIRED: ${DATA_DELETION_WORKER_REQUIRED:-false}
      DATA_DELETION_WORKER_ENABLED: ${DATA_DELETION_WORKER_ENABLED:-false}
      DATA_DELETION_WORKER_HEALTH_URL: ${DATA_DELETION_WORKER_HEALTH_URL:-http://data-deletion-worker:8094/health}
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/.cache
      CALENDAR_FEATURE_ENABLED: ${CALENDAR_FEATURE_ENABLED:-false}
      CALENDAR_SYNC_REQUIRED: ${CALENDAR_SYNC_REQUIRED:-false}
      CALENDAR_SYNC_WORKER_ENABLED: ${CALENDAR_SYNC_WORKER_ENABLED:-true}
      CALENDAR_SYNC_WORKER_HEALTH_URL: ${CALENDAR_SYNC_WORKER_HEALTH_URL:-http://calendar-sync-worker:8091/health}
      CALENDAR_CREDENTIALS_SECRET: ${CALENDAR_CREDENTIALS_SECRET:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      MICROSOFT_CALENDAR_CLIENT_ID: ${MICROSOFT_CALENDAR_CLIENT_ID:-}
      MICROSOFT_CALENDAR_CLIENT_SECRET: ${MICROSOFT_CALENDAR_CLIENT_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      FRONTEND_PRIMARY_URL: ${FRONTEND_PRIMARY_URL:-}
      ALLOW_REMOTE_DATASET_URLS: ${ALLOW_REMOTE_DATASET_URLS:-false}
      REMOTE_INGESTION_WORKER_URL: ${REMOTE_INGESTION_WORKER_URL:-http://remote-ingestion-worker:8093/fetch}
      REMOTE_INGESTION_WORKER_HEALTH_URL: ${REMOTE_INGESTION_WORKER_HEALTH_URL:-http://remote-ingestion-worker:8093/health}
      REMOTE_INGESTION_BACKEND_TIMEOUT_SECONDS: ${REMOTE_INGESTION_BACKEND_TIMEOUT_SECONDS:-45}
      PARSER_ISOLATED_WORKER_ENABLED: ${PARSER_ISOLATED_WORKER_ENABLED:-true}
      PARSER_WORKER_URL: ${PARSER_WORKER_URL:-http://parser-worker:8092/parse}
      PARSER_WORKER_HEALTH_URL: ${PARSER_WORKER_HEALTH_URL:-http://parser-worker:8092/health}
      PARSER_WORKER_TIMEOUT_SECONDS: ${PARSER_WORKER_TIMEOUT_SECONDS:-60}
    depends_on:
      redis:
        condition: service_healthy
      parser-worker:
        condition: service_healthy
      remote-ingestion-worker:
        condition: service_healthy
    networks:
      - default
      - parser_internal
      - remote_ingestion_internal
    ports:
      - "127.0.0.1:${MADAR_BACKEND_BIND_PORT:-8001}:8000"
    volumes:
      - ${MADAR_STORAGE_ROOT:-../backend}/avatar_uploads:/app/avatar_uploads
      - type: bind
        source: ${MADAR_STORAGE_ROOT:-../backend}/uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - ${MADAR_STORAGE_ROOT:-../backend}/private_uploads:/app/private_uploads
      - ${MADAR_STORAGE_ROOT:-../backend}/private_generated_charts:/app/private_generated_charts
      - ./database:/app/database:ro
      - ./supabase:/app/supabase:ro
      - ./scripts:/scripts:ro
      - ./backend/Dockerfile:/test-repository/backend/Dockerfile:ro
      - ./frontend/Dockerfile:/test-repository/frontend/Dockerfile:ro
      - ./frontend/security_headers.conf.template:/test-repository/frontend/security_headers.conf.template:ro
      - ./docker-compose.yml:/test-repository/docker-compose.yml:ro
      - ./docker-compose.dev.yml:/test-repository/docker-compose.dev.yml:ro
      - ./deployment:/test-repository/deployment:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    cpus: 2.00
    mem_limit: 2g
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  notification-worker:
    image: ${MADAR_BACKEND_IMAGE:-madar-backend:development}
    build:
      context: ./backend
    container_name: madar-${MADAR_SLOT:-active}-notification-worker
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    profiles: ["workers"]
    env_file:
      - ${MADAR_ENV_FILE:-../.env}
    environment:
      APP_ENV: production
      MADAR_RELEASE_SHA: ${MADAR_RELEASE_SHA:-development}
      MADAR_BUILD_TIMESTAMP: ${MADAR_BUILD_TIMESTAMP:-unknown}
      EMAIL_CHANNEL_ENABLED: ${EMAIL_CHANNEL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SUPABASE_DB_URL: ""
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      NOTIFICATION_WORKER_ENABLED: ${MADAR_RELEASE_WORKERS_ACTIVE:-true}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-25}
      NOTIFICATION_WORKER_CONCURRENCY: ${NOTIFICATION_WORKER_CONCURRENCY:-2}
      NOTIFICATION_WORKER_POLL_SECONDS: ${NOTIFICATION_WORKER_POLL_SECONDS:-5}
      NOTIFICATION_WORKER_HEALTH_HOST: 0.0.0.0
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
    command: ["python", "-m", "workers.notification_worker"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: 1.00
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  calendar-sync-worker:
    image: ${MADAR_BACKEND_IMAGE:-madar-backend:development}
    build:
      context: ./backend
    container_name: madar-${MADAR_SLOT:-active}-calendar-sync-worker
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    env_file:
      - ${MADAR_ENV_FILE:-../.env}
    environment:
      APP_ENV: production
      MADAR_RELEASE_SHA: ${MADAR_RELEASE_SHA:-development}
      MADAR_BUILD_TIMESTAMP: ${MADAR_BUILD_TIMESTAMP:-unknown}
      SUPABASE_DB_URL: ""
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      CALENDAR_CREDENTIALS_SECRET: ${CALENDAR_CREDENTIALS_SECRET:-}
      CALENDAR_SYNC_WORKER_ENABLED: ${MADAR_RELEASE_WORKERS_ACTIVE:-true}
      CALENDAR_SYNC_BATCH_SIZE: ${CALENDAR_SYNC_BATCH_SIZE:-10}
      CALENDAR_SYNC_POLL_SECONDS: ${CALENDAR_SYNC_POLL_SECONDS:-5}
      CALENDAR_INBOUND_SYNC_INTERVAL_SECONDS: ${CALENDAR_INBOUND_SYNC_INTERVAL_SECONDS:-300}
      CALENDAR_INBOUND_SYNC_BATCH_SIZE: ${CALENDAR_INBOUND_SYNC_BATCH_SIZE:-2}
      CALENDAR_SYNC_WORKER_HEALTH_HOST: 0.0.0.0
      CALENDAR_SYNC_WORKER_HEALTH_PORT: 8091
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      MICROSOFT_CALENDAR_CLIENT_ID: ${MICROSOFT_CALENDAR_CLIENT_ID:-}
      MICROSOFT_CALENDAR_CLIENT_SECRET: ${MICROSOFT_CALENDAR_CLIENT_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      FRONTEND_PRIMARY_URL: ${FRONTEND_PRIMARY_URL:-}
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
    command: ["python", "-m", "workers.calendar_sync_worker"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: 1.00
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  data-deletion-worker:
    image: ${MADAR_BACKEND_IMAGE:-madar-backend:development}
    build:
      context: ./backend
    container_name: madar-${MADAR_SLOT:-active}-data-deletion-worker
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # Schema 083 is required. This deliberately separate profile prevents a
    # generic worker deployment from starting the deletion consumer early.
    profiles: ["deletion-worker"]
    env_file:
      - ${MADAR_ENV_FILE:-../.env}
    environment:
      APP_ENV: production
      MADAR_RELEASE_SHA: ${MADAR_RELEASE_SHA:-development}
      MADAR_BUILD_TIMESTAMP: ${MADAR_BUILD_TIMESTAMP:-unknown}
      SUPABASE_DB_URL: ""
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      CALENDAR_CREDENTIALS_SECRET: ${CALENDAR_CREDENTIALS_SECRET:-}
      DATA_DELETION_WORKER_ENABLED: ${MADAR_RELEASE_WORKERS_ACTIVE:-true}
      DATA_DELETION_WORKER_BATCH_SIZE: ${DATA_DELETION_WORKER_BATCH_SIZE:-5}
      DATA_DELETION_WORKER_POLL_SECONDS: ${DATA_DELETION_WORKER_POLL_SECONDS:-10}
      DATA_DELETION_WORKER_HEALTH_HOST: 0.0.0.0
      DATA_DELETION_WORKER_HEALTH_PORT: 8094
      MADAR_ALERT_HOOK: /scripts/madar_alert_hook.sh
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
    command: ["python", "-m", "workers.data_deletion_worker"]
    volumes:
      - ${MADAR_STORAGE_ROOT:-../backend}/private_uploads:/app/private_uploads
      - ${MADAR_STORAGE_ROOT:-../backend}/private_generated_charts:/app/private_generated_charts
      - ./scripts:/scripts:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: 0.50
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  parser-worker:
    image: ${MADAR_BACKEND_IMAGE:-madar-backend:development}
    build:
      context: ./backend
    container_name: madar-${MADAR_SLOT:-active}-parser-worker
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=65534,gid=65534
    environment:
      APP_ENV: production
      MADAR_RELEASE_SHA: ${MADAR_RELEASE_SHA:-development}
      MADAR_BUILD_TIMESTAMP: ${MADAR_BUILD_TIMESTAMP:-unknown}
      DATA_UPLOAD_DIR: /app/private_uploads
      MADAR_UPLOAD_WORKSPACE_DIR: /tmp/madar_parser
      PARSER_WORKER_PROCESS: "true"
      PARSER_WORKER_HEALTH_HOST: 0.0.0.0
      PARSER_WORKER_PORT: 8092
      PARSER_JOB_TIMEOUT_SECONDS: ${PARSER_JOB_TIMEOUT_SECONDS:-55}
      ALLOW_REMOTE_DATASET_URLS: "false"
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
    command: ["python", "-m", "workers.parser_worker"]
    volumes:
      - ${MADAR_STORAGE_ROOT:-../backend}/private_uploads:/app/private_uploads:ro
    networks:
      - parser_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: 0.75
    mem_limit: 768m
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  remote-ingestion-worker:
    image: ${MADAR_BACKEND_IMAGE:-madar-backend:development}
    build:
      context: ./backend
    container_name: madar-${MADAR_SLOT:-active}-remote-ingestion-worker
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=65534,gid=65534
    environment:
      APP_ENV: production
      MADAR_RELEASE_SHA: ${MADAR_RELEASE_SHA:-development}
      MADAR_BUILD_TIMESTAMP: ${MADAR_BUILD_TIMESTAMP:-unknown}
      REMOTE_INGESTION_WORKER_HOST: 0.0.0.0
      REMOTE_INGESTION_WORKER_PORT: 8093
      REMOTE_INGESTION_DEADLINE_SECONDS: ${REMOTE_INGESTION_DEADLINE_SECONDS:-35}
      REMOTE_INGESTION_HARD_TIMEOUT_SECONDS: ${REMOTE_INGESTION_HARD_TIMEOUT_SECONDS:-40}
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
    command: ["python", "-m", "workers.remote_ingestion_worker"]
    networks:
      - remote_ingestion_internal
      - remote_ingestion_egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: 0.50
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  frontend:
    image: ${MADAR_FRONTEND_IMAGE:-madar-frontend:development}
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        MADAR_REQUIRE_PRODUCTION_API_URL: ${MADAR_REQUIRE_PRODUCTION_API_URL:-true}
        MADAR_RELEASE_SHA: ${MADAR_RELEASE_SHA:-development}
        MADAR_BUILD_TIMESTAMP: ${MADAR_BUILD_TIMESTAMP:-unknown}
    container_name: madar-${MADAR_SLOT:-active}-frontend
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101,size=32m
      - /etc/nginx/conf.d:rw,noexec,nosuid,uid=101,gid=101,size=1m
    environment:
      APP_ENV: production
      MADAR_RELEASE_SHA: ${MADAR_RELEASE_SHA:-development}
      MADAR_CSP_CONNECT_SRC: ${MADAR_CSP_CONNECT_SRC:-https://api.madarportal.com}
      MADAR_HSTS: ${MADAR_HSTS:-}
    ports:
      - "127.0.0.1:${MADAR_FRONTEND_BIND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    cpus: 0.50
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  parser_internal:
    internal: true
  remote_ingestion_internal:
    internal: true
  remote_ingestion_egress: {}
