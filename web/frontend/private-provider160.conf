# Explicitly selected only by the protected canonical160 private gateway role.
# This immutable image file is not included by the public frontend configuration.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
stream {
  limit_conn_zone $binary_remote_addr zone=calendar_clients:32k;
  server {
    listen 5432;
    limit_conn calendar_clients 16;
    proxy_connect_timeout 3s;
    proxy_timeout 15s;
    proxy_pass supabase-db:5432;
  }
}
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 264241152;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;
  server {
    listen 8000;
    location = /health { return 200 'private-provider160\n'; }
    location /auth/v1/ { proxy_pass http://supabase-auth:9999/; proxy_set_header Host $http_host; }
    location /rest/v1/ { proxy_pass http://supabase-rest:3000/; proxy_set_header Host $http_host; }
    location /storage/v1/ { proxy_pass http://supabase-storage:5000/; proxy_set_header Host $http_host; }
    location / { return 404; }
  }
}
