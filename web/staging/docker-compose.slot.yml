services:
  redis:
    # Slot-local Redis preserves blue/green isolation. The control Redis exists
    # only for explicit failure/pressure drills.
    ports: !override []

  backend:
    user: "65534:1000"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SUPABASE_URL: http://host.docker.internal:15430
      SUPABASE_ANON_KEY: ${STAGING_ANON_JWT}
      SUPABASE_SERVICE_KEY: ${STAGING_SERVICE_JWT}
      FRONTEND_URLS: http://127.0.0.1:13000
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:13000
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      ADMIN_MFA_LOGIN_ENFORCEMENT: "true"
      EMAIL_CHANNEL_ENABLED: "false"
      CALENDAR_FEATURE_ENABLED: "false"
      ALLOW_REMOTE_DATASET_URLS: "false"
      NOTIFICATION_WORKER_REQUIRED: "true"
      NOTIFICATION_WORKER_ENABLED: "true"
      NOTIFICATION_WORKER_HEALTH_URL: http://notification-worker:8090/health
      DATA_DELETION_WORKER_REQUIRED: ${STAGING_DELETION_REQUIRED:-false}
      DATA_DELETION_WORKER_ENABLED: ${STAGING_DELETION_REQUIRED:-false}
      DATA_DELETION_WORKER_HEALTH_URL: http://data-deletion-worker:8094/health
      PARSER_ISOLATED_WORKER_ENABLED: "true"
      STORAGE_DISK_FREE_FLOOR_BYTES: 104857600

  notification-worker:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SUPABASE_URL: http://host.docker.internal:15430
      SUPABASE_SERVICE_KEY: ${STAGING_SERVICE_JWT}
      EMAIL_CHANNEL_ENABLED: "false"

  data-deletion-worker:
    user: "65534:1000"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SUPABASE_URL: http://host.docker.internal:15430
      SUPABASE_SERVICE_KEY: ${STAGING_SERVICE_JWT}

  calendar-sync-worker:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SUPABASE_URL: http://host.docker.internal:15430
      SUPABASE_SERVICE_KEY: ${STAGING_SERVICE_JWT}
      CALENDAR_SYNC_WORKER_ENABLED: "true"

  frontend:
    environment:
      MADAR_CSP_CONNECT_SRC: http://127.0.0.1:18001
      MADAR_HSTS: ""
