services:
  redis:
    container_name: madar-dev-redis
    ports: !override []

  backend:
    container_name: madar-dev-backend
    ports: !override
      - "127.0.0.1:8002:8000"
    environment:
      APP_ENV: development
      CALENDAR_FEATURE_ENABLED: ${CALENDAR_FEATURE_ENABLED:-true}
      PUBLIC_API_URL: http://127.0.0.1:8002
      FRONTEND_PRIMARY_URL: http://127.0.0.1:3001

  notification-worker:
    environment:
      APP_ENV: development

  calendar-sync-worker:
    environment:
      APP_ENV: development
      PUBLIC_API_URL: http://127.0.0.1:8002
      FRONTEND_PRIMARY_URL: http://127.0.0.1:3001

  frontend:
    container_name: madar-dev-frontend
    ports: !override
      - "127.0.0.1:3001:8080"
    environment:
      MADAR_CSP_CONNECT_SRC: http://127.0.0.1:8002
