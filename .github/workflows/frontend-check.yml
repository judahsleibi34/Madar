name: Frontend Check

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact clean source
        run: |
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Verify dependency locks
        run: python3 web/scripts/check_dependency_locks.py

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: web/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: web/frontend
        run: npm test

      - name: Build frontend
        working-directory: web/frontend
        run: npm run build

      - name: Audit shipped frontend dependencies
        working-directory: web/frontend
        run: npm audit --omit=dev --audit-level=high
