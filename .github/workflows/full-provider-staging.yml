name: Full Provider Staging

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: full-provider-staging
  cancel-in-progress: false

jobs:
  full-provider-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_HISTORY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout exact source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install locked PostgreSQL parser
        run: python3 -m pip install --require-hashes -r web/backend/requirements-migration-tools.txt
      - name: Select the native OCI image store on the owned disposable runner
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = judahsleibi34/Madar
          sudo -n python3 - <<'PY'
          import json,os,pathlib,socket,stat,subprocess
          if socket.gethostname() in ('madar-gpu','madar-node1','madar-staging') or not pathlib.Path('/home/runner').is_dir():
              raise RuntimeError('ephemeral_host_required')
          docker=['/usr/bin/docker','--host','unix:///var/run/docker.sock']
          if subprocess.check_output(docker+['ps','-aq'],timeout=30).strip():
              raise RuntimeError('empty_owned_daemon_required')
          def native():
              rows=json.loads(subprocess.check_output(docker+['info','--format','{{json .DriverStatus}}'],timeout=30))
              return ['driver-type','io.containerd.snapshotter.v1'] in rows
          if not native():
              target=pathlib.Path('/etc/docker/daemon.json')
              for parent in (pathlib.Path('/etc'),target.parent):
                  info=parent.lstat()
                  if not stat.S_ISDIR(info.st_mode) or info.st_uid!=0 or info.st_mode&0o022:
                      raise RuntimeError('ephemeral_daemon_parent_untrusted')
              original=b'';mode=0o600;present=target.exists() or target.is_symlink()
              if present:
                  fd=os.open(target,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
                  with os.fdopen(fd,'rb') as stream:
                      info=os.fstat(stream.fileno())
                      if not stat.S_ISREG(info.st_mode) or info.st_uid!=0 or info.st_mode&0o022 or info.st_size>1048576:
                          raise RuntimeError('ephemeral_daemon_configuration_untrusted')
                      original=stream.read(1048577);mode=stat.S_IMODE(info.st_mode)
              preimage=pathlib.Path('/run/madar-ci-image-store-preimage.json')
              with preimage.open('xb') as stream:
                  os.fchmod(stream.fileno(),0o600);stream.write(original);stream.flush();os.fsync(stream.fileno())
              body=json.loads(original or b'{}')
              body.setdefault('features',{})['containerd-snapshotter']=True
              def install(raw,permissions):
                  pending=target.with_name('.madar-ci-daemon.json')
                  fd=os.open(pending,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,permissions)
                  with os.fdopen(fd,'wb') as stream:stream.write(raw);stream.flush();os.fsync(stream.fileno())
                  os.replace(pending,target)
                  fd=os.open(target.parent,os.O_RDONLY|os.O_DIRECTORY)
                  try:os.fsync(fd)
                  finally:os.close(fd)
              install(json.dumps(body,sort_keys=True).encode(),0o600)
              try:
                  subprocess.run(['systemctl','restart','docker'],check=True,timeout=60)
                  if not native():raise RuntimeError('native_oci_store_not_observed')
              except Exception:
                  if present:install(original,mode)
                  else:target.unlink()
                  subprocess.run(['systemctl','restart','docker'],check=True,timeout=60)
                  raise
          print(json.dumps({'native_oci_store_verified':True,'production_authorized':False}))
          PY
      - name: Prepare locked browser tools on the disposable runner
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install locked browser dependencies
        working-directory: web/frontend
        run: |
          npm ci
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Download authenticated exact-source candidate after independent CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          python3 web/scripts/fetch_full_provider_artifacts.py \
            --source-sha "$CI_SOURCE_SHA" \
            --directory "$HOME/madar-provider-artifacts-${CI_SOURCE_SHA:0:12}"
      - name: Native full-provider acceptance without deployment authority
        run: |
          timeout 15m python3 web/staging/integration/full_provider_staging.py REHEARSE \
            --source-sha "$CI_SOURCE_SHA" --history-base-sha "$CI_HISTORY_BASE_SHA" \
            --artifacts "$HOME/madar-provider-artifacts-${CI_SOURCE_SHA:0:12}"
          cp "$HOME/madar-full-provider-${CI_SOURCE_SHA:0:12}/full-provider-acceptance.json" full-provider-acceptance.json
      - name: Retain sanitized acceptance only
        if: always()
        run: |
          for result in full-provider-acceptance full-provider-failure; do
            if test -f "$HOME/madar-full-provider-${CI_SOURCE_SHA:0:12}/$result.json"; then
              cp "$HOME/madar-full-provider-${CI_SOURCE_SHA:0:12}/$result.json" "$result.json"
            fi
          done
      - name: Upload sanitized provider results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-provider-${{ env.CI_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            full-provider-acceptance.json
            full-provider-failure.json
          if-no-files-found: warn
          retention-days: 7
