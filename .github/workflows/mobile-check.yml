name: Mobile Check

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"

permissions:
  contents: read

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact clean source
        run: |
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm run typecheck

      - name: Lint mobile
        run: npm run lint

      - name: Validate static web export
        run: npm run build:web
