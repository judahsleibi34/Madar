[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "madar-cv-reranker"
version = "1.0.0"
description = "Authenticated CPU semantic reranking service for private CV batches"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "fastapi==0.136.3",
  "email-validator==2.3.0",
  "PyJWT==2.13.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.12.0",
  "pypdf==6.6.2",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "psycopg[binary]==3.3.2",
  "SQLAlchemy==2.0.51",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
model = [
  "onnxruntime==1.27.0",
  "sentence-transformers[onnx]==5.6.0",
]
dev = [
  "aiosqlite==0.22.1",
  "httpx==0.28.1",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires a PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S104", "S105", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["docx.*", "pypdf.*", "sentence_transformers.*"]
ignore_missing_imports = true